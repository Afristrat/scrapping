# =============================================================================
# Kairos Frontend — config nginx Enterprise self-hosted
# =============================================================================
# Sert le bundle Vite (SPA) + reverse proxy vers Kong (API gateway Supabase).
# Diffère de nginx.conf racine (Coolify cloud) en proxy-passant les routes
# Supabase (/auth/v1, /rest/v1, /storage/v1, /functions/v1) vers Kong.
# =============================================================================

upstream kong_upstream {
    server kong:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sécurité de base
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Health endpoint (utilisé par le HEALTHCHECK Docker + UptimeRobot)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets versionnés Vite (hashés) — cache long terme
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # =============================================================================
    # Reverse proxy Supabase via Kong gateway
    # =============================================================================
    # Ces routes sont consommées par @supabase/supabase-js depuis le navigateur.
    # Kong route ensuite vers gotrue / postgrest / storage-api / edge-runtime.

    location /auth/v1/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /rest/v1/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /storage/v1/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Storage = uploads/downloads volumineux
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /functions/v1/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Edge functions peuvent prendre du temps (scoring LLM)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /realtime/v1/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # =============================================================================
    # SPA fallback : toutes les autres routes -> index.html
    # =============================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Erreurs propres
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
