# =============================================================================
# Kong API Gateway — config déclarative Kairos Enterprise
# =============================================================================
# Route les requêtes du frontend vers les services Supabase internes.
# Synchronisé avec docker/nginx.conf (mêmes paths exposés).
# =============================================================================

_format_version: "3.0"
_transform: true

###
### Consumers (anon, service_role)
###
consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

###
### ACLs
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  ###
  ### Auth (GoTrue)
  ###
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  ###
  ### REST (PostgREST)
  ###
  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ###
  ### Storage
  ###
  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  ###
  ### Edge Functions
  ###
  - name: functions-v1
    url: http://supabase-functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors

  ###
  ### Postgres Meta (Studio)
  ###
  - name: meta
    url: http://supabase-meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
